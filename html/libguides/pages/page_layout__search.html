    <body class="s-lib-public-body">
        <a href="#s-lib-public-main"
        class="visually-hidden-focusable btn btn-dark position-absolute start-50 translate-middle-x z-1 mt-1">
        Skip to main content</a>

        <!-- BEGIN: Page Header -->
        {{public_header}}

        <!-- END: Page Header -->
        <!-- BEGIN: Content Header -->
        <div id="s-lib-public-header" class="s-lib-header container s-lib-side-borders">
            <nav id="s-lib-bc" aria-label="breadcrumb">
            {{breadcrumbs}}

            </nav>
            <h1 id="s-lib-public-header-title">{{page_title}}
            </h1>
            <div id="s-lib-public-header-desc">{{page_description}}
            </div>
        </div>
        <!-- END: Content Header -->
        <!-- BEGIN: Nav Bar -->
        <nav id="s-lib-public-nav" class="container s-lib-side-borders">
            {{page_nav}}
        </nav>
        <!-- END: Nav Bar -->
        <!-- BEGIN: content -->
        <main id="s-lib-public-main" class="s-lib-main container s-lib-side-borders" tabindex="-1">
            <section>
                <div id="s-lg-srch-nav-col" class="row">
                    <div id="col0" class="col-md-12 text-center">
                        {{content_box_search}}
                    </div>
                    <div id="s-lg-srch-results-msg" class="col-md-12 mb-3"></div>
                </div>
            </section>
            <section>
                <div id="s-lg-srch-cols">
                    {{content}}
                </div>
            </section>
        </main>
        <!-- END: content -->
        <!-- BEGIN: Page Footer -->
        {{system_footer}}

        <!-- END: Page Footer -->
        <div id="s-lib-alert" title=""><div id="s-lib-alert-content"></div></div>
        <!-- popover.twig -->
        <div id="s-lib-popover-title" class="hide">
            <span class="text-info">
                <strong>title</strong>
            </span>

            <button type="button" id="popclose" class="close" onclick="jQuery('.s-lib-popover').popover('hide')">
            &times;
            </button>
        </div>

        <div id="s-lib-popover-content" class="hide">
            <i class="fa fa-refresh fa-spin"></i> Loading...
            <button class="btn btn-default btn-sm popclose" type="button">Close</button>
        </div>
        <!-- !popover.twig -->

        <!-- scroll_top.twig -->
        <div id="s-lib-scroll-top">
            <a href="javascript:void(0);" onclick="jQuery('body').focus();" title="Back to Top"
            aria-label="Back to Top">
                <span class="fa-stack fa-lg" aria-hidden="true">
                    <i class="fa fa-square-o fa-stack-2x"></i>
                    <i class="fa fa-angle-double-up fa-stack-1x" style="position:relative; bottom:2px;"></i>
                </span>
            </a>
        </div>
        <!-- !scroll_top.twig -->


        <!-- BEGIN: Custom Footer -->
        {{public_footer}}


        <!-- END: Custom Footer -->
    </body>
</html>
